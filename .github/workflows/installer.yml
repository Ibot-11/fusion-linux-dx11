name: Installer and SpaceMouse
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev qt6-base-dev qt6-base-dev-tools libx11-dev g++-mingw-w64-x86-64
      - name: Build runtime
        run: |
          make -C layer
          make -C manager
          bash spacemouse/build.sh
          (cd spacemouse/prebuilt && sha256sum --check SHA256SUMS)
      - name: Installer and update tests
        run: python3 -m unittest discover -s tests -v
      - name: Calibration and process tests
        run: |
          python3 -m unittest discover -s spacemouse/tests -p test_camera_gain.py -v
          python3 -m unittest discover -s spacemouse/tests -p test_camera_control.py -v
          python3 -m unittest discover -s spacemouse/tests -p test_processes.py -v
      - name: Direct input and bridge tests
        run: |
          python3 -m unittest discover -s spacemouse/tests -p test_evdev.py -v
          python3 -m unittest discover -s spacemouse/tests -p test_hidraw.py -v
          python3 -m unittest discover -s spacemouse/tests -p test_keybindings.py -v
      - name: Shortcut recorder tests
        run: make -C manager check
      - name: Native manager smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: manager/run.sh --smoke-test --target /tmp/fusion-manager-empty
      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh spacemouse/*.sh
