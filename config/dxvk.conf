# DXVK configuration for Autodesk Fusion 360

# Keep frame latency minimal
dxgi.maxFrameLatency = 1
d3d11.maxFrameLatency = 1

# Defer Vulkan surface creation until first Present to avoid multi-monitor/KDE resize churn
dxgi.deferSurfaceCreation = True

# Disable DXVK state cache to prevent pipeline desync / hall-of-mirrors across launches
dxvk.enableStateCache = False

# Prevent MSAA from turning back on (causes black viewport in DXVK)
d3d11.disableMsaa = True

# Thread-safety for multi-threaded D3D11 calls between canvas and floating HUDs
d3d11.enableContextLock = True
